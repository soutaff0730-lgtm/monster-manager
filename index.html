<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>モンスト データ管理</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2f6fed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="モンスト管理">
    <link rel="apple-touch-icon" href="icon-192.png">

</head>


<body>

    <h1>モンスト データ管理</h1>

    <!-- ================================= -->
    <!-- アカウント登録 -->
    <!-- ================================= -->

    <section>

        <h2>アカウント登録</h2>

        <input
            type="text"
            id="accountName"
            placeholder="アカウント名"
        >

        <button id="addBtn">
            アカウント追加
        </button>

    </section>

    <!-- ================================= -->
    <!-- PC・スマホ データ共有 -->
    <!-- ================================= -->

    <section class="data-share-section">
        <h2>PC・スマホ データ共有</h2>
        <p class="data-share-note">このボタンでデータを1つのファイルにまとめて移動できます。PCで書き出してスマホで読み込み、スマホで書き出してPCで読み込むこともできます。</p>
        <div class="data-share-buttons">
            <button id="exportDataBtn" type="button">データを書き出す</button>
            <button id="importDataBtn" type="button">データを読み込む</button>
            <button id="shareDataBtn" type="button">共有する</button>
            <input id="importDataFile" type="file" accept="application/json,.json" hidden>
        </div>
    </section>


    <!-- ================================= -->
    <!-- キャラ追加 -->
    <!-- ================================= -->

    <section>

        <h2>キャラ追加</h2>

        <select id="accountSelect">

            <option value="">
                アカウントを選択
            </option>

        </select>


        <input
            type="text"
            id="characterName"
            placeholder="キャラ名"
            autocomplete="off"
        >

        <select id="characterEvolution">
            <option value="進化前">進化前</option>
            <option value="進化">進化</option>
            <option value="神化">神化</option>
            <option value="獣神化">獣神化</option>
            <option value="獣神化・改">獣神化・改</option>
            <option value="真・獣神化">真・獣神化</option>
        </select>

        <button id="addCharacterBtn">
            キャラ追加
        </button>

    </section>

    <!-- ================================= -->
    <!-- わくわくの実追加 -->
    <!-- ================================= -->

    <section>

        <h2>わくわくの実追加</h2>


        <select id="fruitAccountSelect">

            <option value="">
                アカウントを選択
            </option>

        </select>


        <select id="fruitCharacterSelect">

            <option value="">
                キャラを選択
            </option>

        </select>


        <select id="fruitName">

            <option value="">
                わくわくの実を選択
            </option>

        </select>


        <select id="fruitRank">

            <option value="">
                階級を選択
            </option>

        </select>

        <button id="addFruitBtn">
            実を追加
        </button>

        <div id="bulkFruitArea" class="bulk-fruit-area">
            <h3>わくわくの実を一括選択</h3>
            <p id="bulkFruitNotice" class="bulk-fruit-notice">キャラを選択すると、使用できる個数が表示されます。</p>
            <div id="bulkFruitTabs" class="bulk-fruit-tabs"></div>
            <div id="bulkFruitList" class="bulk-fruit-list"></div>
            <div class="bulk-fruit-selected-wrap">
                <div class="bulk-fruit-selected-title">選択中の実 <span id="bulkFruitSelectedCount">0 / 2</span></div>
                <div id="bulkFruitSelected" class="bulk-fruit-selected"></div>
            </div>
            <button id="bulkFruitBtn" type="button">選択した実をまとめて登録</button>
        </div>

    </section>


    <!-- ================================= -->
    <!-- 検索 -->
    <!-- ================================= -->

    <section>

        <h2>キャラ検索</h2>


        <select id="searchAccount">

            <option value="all">
                全アカウント
            </option>

        </select>


        <input
            type="text"
            id="searchBox"
            placeholder="キャラ名・わくわくの実を検索"
        >


        <button id="searchBtn">
            検索
        </button>


        <button id="clearSearchBtn">
            検索解除
        </button>


        <div id="searchResult"></div>

    </section>

    <!-- ================================= -->
    <!-- アカウントタブ -->
    <!-- ================================= -->

    <section>

        <h2>アカウント</h2>

        <div id="accountTabs"></div>

    </section>


    <!-- ================================= -->
    <!-- 選択中アカウント -->
    <!-- ================================= -->

    <section>

        <div id="accountDisplay"></div>

    </section>


    <!-- ================================= -->
    <!-- キャラ編集モーダル -->
    <!-- ================================= -->
    <div id="characterEditModal" class="edit-modal" aria-hidden="true">
        <div class="edit-modal-backdrop" id="characterEditBackdrop"></div>
        <div class="edit-modal-content" role="dialog" aria-modal="true" aria-labelledby="characterEditTitle">
            <h2 id="characterEditTitle">キャラ編集</h2>

            <label class="edit-field-label">キャラ名</label>
            <input type="text" id="editCharacterName" autocomplete="off">

            <label class="edit-field-label">進化形態</label>
            <select id="editCharacterEvolution">
                <option value="進化前">進化前</option>
                <option value="進化">進化</option>
                <option value="神化">神化</option>
                <option value="獣神化">獣神化</option>
                <option value="獣神化・改">獣神化・改</option>
                <option value="真・獣神化">真・獣神化</option>
            </select>

            <div class="edit-book-options">
                <p>使用している書</p>
                <label id="editGreatHeroBookLabel"><input type="checkbox" id="editGreatHeroBook"> <span id="editGreatHeroBookIcon"></span>大英雄の書</label>
                <label id="editHeroBookLabel"><input type="checkbox" id="editHeroBook"> <span id="editHeroBookIcon"></span>英雄の書</label>
                <label id="editBattleBookLabel"><input type="checkbox" id="editBattleBook"> <span id="editBattleBookIcon"></span>戦型の書</label>
                <label id="editLevelBookLabel"><input type="checkbox" id="editLevelBook"> <span id="editLevelBookIcon"></span>レベルの書</label>
                <label id="editConnectBookLabel"><input type="checkbox" id="editConnectBook"> <span id="editConnectBookIcon"></span>コネクトスキルの書</label>
                <p id="editBookNotice" class="book-notice"></p>
            </div>

            <div class="edit-modal-buttons">
                <button type="button" id="cancelCharacterEditBtn">キャンセル</button>
                <button type="button" id="saveCharacterEditBtn">変更を保存</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
    </script>

</body>
